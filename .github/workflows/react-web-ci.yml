name: React Web CI
on:
  push:
    branches: [main, feat/react-web-supabase]
  pull_request:
permissions:
  contents: write
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
        continue-on-error: true
      - name: Install exact dependencies and generate lockfile
        run: npm install --no-audit --no-fund --save-exact
      - name: Test core game
        run: npm run test
      - name: Build React
        run: npm run build
      - name: Commit generated lockfile to feature branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/react-web-supabase'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: lock React web dependency tree'
            git push
          fi
